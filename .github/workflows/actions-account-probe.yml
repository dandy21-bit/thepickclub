name: Actions account probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-account-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-account-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "GitHub Actions account probe OK"
